name: Publish to npm

# Publishes @voicetel.com/voiceml to npm on every v* tag push, after the full CI workflow
# (lint, typecheck, tests on every supported Node, package smoke tests) has passed.
# Uses an automation token stored as the NPM_TOKEN secret at
# https://github.com/voicetel/voiceml-node-sdk/settings/secrets/actions
#
# To create the token:
#   1. Sign in at npmjs.com as the publisher account.
#   2. Account settings → Access Tokens → Generate New Token → Automation.
#   3. Copy the token into the NPM_TOKEN repo secret.
#
# Provenance is enabled (`--provenance`) so the published artifact carries
# a cryptographic attestation of the GitHub Actions run that produced it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for `npm publish --provenance`

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    # A manual dispatch must still target a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag == package.json version == VERSION constant
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          const="$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" src/version.ts)"
          echo "tag=$tag package.json=$pkg VERSION=$const"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$const" ]; then
            echo "::error::tag v$tag does not match package.json ($pkg) and src/version.ts ($const)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (with provenance)
        # Idempotent: a tag re-push or duplicate trigger must not fail with
        # E409 when the version is already live on the registry.
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@voicetel.com/voiceml@$version" version >/dev/null 2>&1; then
            echo "@voicetel.com/voiceml@$version is already published — skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
